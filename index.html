.courts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:grid;gap:6px}

.toast.undo button{flex:none;height:40px;border:0;border-radius:8px;padding:0 14px;background:var(--bg);color:var(--ink);font-weight:700;cursor:pointer}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;z-index:30}
@media (prefers-reduced-motion: no-preference){.sheet.anim{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px)}}}
</style>

    lg.p = list.map(x=>{ const [name,dojo] = x.split('/'); return {name, dojo}; });
  }
}
function boot(){
  render();
  let app;
  try{ app = initializeApp(firebaseConfig); fs = getFirestore(app); }catch(e){ mode = 'off'; render(); return; }
  mode = 'shared'; canWrite = false;
  const onErr = ()=>{ mode = 'error'; render(); };
  onSnapshot(doc(fs,'extra','n11-roster'), snap=>{
    try{ if(!snap.exists()) throw 0; applyRoster(JSON.parse(snap.data().json)); rosterOK = true; }catch(e){ rosterOK = false; }
    render();
  }, onErr);
  for(const [k,col] of Object.entries(COLS)){
    onSnapshot(collection(fs,col), snap=>{
      const m = {};
      snap.docs.forEach(d=>{ if(d.id.startsWith(PRE)) m[d.id.slice(PRE.length)] = d.data(); });
      S[k] = m; render();
    }, onErr);
  }
  onSnapshot(query(collection(fs,'log'), orderBy('at','desc'), limit(150)), snap=>{
    S.log = snap.docs.map(d=>({lid:d.id, ...d.data()})).filter(x=>x.ev===EV);
    render();
  }, onErr);
  // ログイン状態は localStorage に保存（IndexedDB が固まる端末でも止まらないように）
  const auth = initializeAuth(app, {persistence:[browserLocalPersistence, inMemoryPersistence]});
  onAuthStateChanged(auth, async u=>{
    if(!u) return;
    try{
      const ref = doc(fs,'unlocks',u.uid);
      if(!(await getDoc(ref)).exists()) await setDoc(ref, {pin:PIN, at:Date.now()});
      canWrite = true;
    }catch(e){ canWrite = false; authFailed = true; }
    render();
  });
  signInAnonymously(auth).catch(()=>{ authFailed = true; render(); });
}

// 書き込み＋履歴。before / after を残すので、どの入力でも後から元に戻せる
const queues = {};
function writeDoc(kind, id, data){
  if(data) S[kind][id] = data; else delete S[kind][id];
  const ref = doc(fs, COLS[kind], PRE+id), key = kind+'/'+id;
  queues[key] = (queues[key]||Promise.resolve()).then(()=> data ? setDoc(ref, data) : deleteDoc(ref)).catch(e=>{
    toast(e?.code==='permission-denied' ? '入力の許可が切れました。ページを開き直してください' : '送信できませんでした。電波の良い場所でもう一度押してください');
  });
}
function put(kind, id, data, label, opts={}){
  if(!canWrite){ toast(authFailed ? '入力の準備ができていません。ページを開き直してください' : '接続中です。数秒待ってからもう一度押してください'); return; }
  const before = S[kind][id] ?? null;
  if(stable(before) === stable(data ?? null)) return;
  writeDoc(kind, id, data);
  logChange([{kind, id, before, after:data ?? null}], label);
  render();
  if(!opts.quiet) undoToast(label);
}
function logChange(changes, label){
  const entry = {ev:EV, at:Date.now(), who:myName(), text:String(label).slice(0,200), changes:JSON.stringify(changes)};
  lastChange = {changes, label};
  addDoc(collection(fs,'log'), entry).catch(()=>{});
}
let lastChange = null;
function undo(changes, label){
  const back = changes.map(c=>({kind:c.kind, id:c.id, before:S[c.kind][c.id] ?? null, after:c.before}));
  back.forEach(c=>writeDoc(c.kind, c.id, c.after));
  logChange(back, '取り消し：'+label);
  render();
  toast('元に戻しました');
}
// 取り消そうとした入力のあとに、同じ所が別の人に書き換えられていないか
function changedSince(changes){ return changes.some(c=>stable(S[c.kind][c.id] ?? null) !== stable(c.after)); }
function stable(v){
  if(v === undefined) v = null;
  if(v === null || typeof v !== 'object') return JSON.stringify(v);
  if(Array.isArray(v)) return '['+v.map(stable).join(',')+']';
  return '{'+Object.keys(v).sort().filter(k=>v[k]!==undefined).map(k=>JSON.stringify(k)+':'+stable(v[k])).join(',')+'}';
}
function myName(){ return (load('name','') || '名前なし').slice(0,20); }

// ===================== 計算 =====================
function hm(t){ const [h,m] = t.split(':').map(Number); return h*60+m; }
function fmt(min){ min = Math.round(min); return `${Math.floor(min/60)}:${String(min%60).padStart(2,'0')}`; }
function seqCount(seq){
  if(seq === 'team') return TEAM.length;
  for(const c of Object.values(CATS)){
    if(c.tseq === seq) return c.tour.length;
    let n = 0; for(const L of Object.values(c.leagues)) if(L.seq === seq) n += L.m.length;
    if(n) return n;
  }
  return 0;
}
// 1試合あたりの分数＝進行表の枠 ÷ 枠内の試合数（予選＋同じ枠の決勝T）
function paceOf(seq){
  const base = SEQS[seq].after || seq, b = SEQS[base];
  if(!b.end) return PACE;
  let n = seqCount(base);
  for(const [k,s] of Object.entries(SEQS)) if(s.after === base) n += seqCount(k);
  return (hm(b.end) - hm(b.start)) / n;
}
function seqStart(seq){
  const s = SEQS[seq];
  return s.start ? hm(s.start) : seqStart(s.after) + seqCount(s.after)*paceOf(s.after);
}
// コート進行：courts/c{n} = {seq, no, at(分)}。予選の進行は同じ枠の決勝Tにも効かせる
function eta(seq, no){
  const s = SEQS[seq], pace = paceOf(seq);
  const c = s?.court ? S.courts['c'+s.court] : null;
  let left = null;
  if(c && c.seq === seq) left = no - c.no;
  else if(c && s.after && c.seq === s.after) left = seqCount(s.after) - c.no + no;
  if(left != null) return {min: c.at + Math.max(0, left)*pace, left, live:true};
  return {min: seqStart(seq) + (no-1)*pace, left:null, live:false};
}

function standings(cat, L){
  const lg = CATS[cat].leagues[L];
  const rows = lg.p.map((p,i)=>({i, ...p, w:0,l:0,d:0,pf:0,pa:0}));
  let done = 0;
  for(const [a,b,no] of lg.m){
    const r = S.results[`${cat}-${L}-${no}`]; if(!r) continue;
    done++;
    const A = rows[a], B = rows[b], sa = +r.sa||0, sb = +r.sb||0;
    A.pf += sa; A.pa += sb; B.pf += sb; B.pa += sa;
    if(r.w === 'a'){ A.w++; B.l++; } else if(r.w === 'b'){ B.w++; A.l++; } else { A.d++; B.d++; }
  }
  const h2h = (x,y)=>{
    const m = lg.m.find(([a,b])=>(a===x.i&&b===y.i)||(a===y.i&&b===x.i)); if(!m) return 0;
    const r = S.results[`${cat}-${L}-${m[2]}`]; if(!r || r.w==='d') return 0;
    const winner = r.w==='a' ? m[0] : m[1];
    return winner === x.i ? -1 : 1;
  };
  const sorted = [...rows].sort((x,y)=> (y.w-x.w) || (x.l-y.l));
  // 勝敗数が同じ組の中で ①直接対決 ②得失点差 ③総得点（P4 リーグ戦に関する補足）
  const out = []; let k = 0;
  while(k < sorted.length){
    const grp = sorted.filter(r=>r.w===sorted[k].w && r.l===sorted[k].l);
    grp.sort((x,y)=>{
      if(grp.length===2){ const h = h2h(x,y); if(h) return h; }
      return ((y.pf-y.pa)-(x.pf-x.pa)) || (y.pf-x.pf);
    });
    out.push(...grp); k += grp.length;
  }
  out.forEach((r,idx)=>{
    r.rank = idx+1;
    const prev = out[idx-1];
    const same = (a,b)=> a && b && a.w===b.w && a.l===b.l && (a.pf-a.pa)===(b.pf-b.pa) && a.pf===b.pf && !(out.filter(z=>z.w===a.w&&z.l===a.l).length===2 && h2h(a,b));
    if(same(prev, r)){ r.rank = prev.rank; r.tie = prev.tie = true; }
  });
  return {rows: out, complete: done === lg.m.length, done, total: lg.m.length};
}

// 参照（A1・W3・L8・tC）を選手／チームに解決
function resolve(cat, ref){
  if(cat === 'team'){
    if(ref[0] === 't'){ const n = S.meta.team?.slots?.[ref[1]]; return n ? {name:n, dojo:n, label:ref[1]} : {label:ref[1], pending:true}; }
  }
  const m = /^([WL])(\d+)$/.exec(ref);
  if(m){
    const no = +m[2], r = S.results[`${cat}-T-${no}`];
    const t = (cat==='team'?TEAM:CATS[cat].tour).find(x=>x[0]===no);
    const lab = `${'⓪①②③④⑤⑥⑦⑧⑨⑩⑪⑫'[no]}${m[1]==='W'?'勝者':'敗者'}`;
    if(!r || r.w==='d') return {label:lab, pending:true};
    const side = (m[1]==='W') === (r.w==='a') ? t[1] : t[2];
    const p = resolve(cat, side);
    return p.pending ? {label:lab, pending:true} : {...p, label:lab};
  }
  const L = ref[0], rank = +ref.slice(1), label = `${L}${rank}位`;
  const manual = S.meta.slots?.map?.[`${cat}:${ref}`];
  const lg = CATS[cat].leagues[L];
  if(manual != null && lg.p[manual]) return {...lg.p[manual], label, id:pid(cat,L,manual), manual:true};
  const st = standings(cat, L);
  if(!st.complete) return {label, pending:true};
  const hit = st.rows.filter(r=>r.rank===rank);
  // 同順位があると、その順位も下の順位も機械では決められない（再試合）
  if(hit.length !== 1 || st.rows.some(r=>r.tie && r.rank<=rank)) return {label, pending:true, tie:true};
  return {...lg.p[hit[0].i], label, id:pid(cat,L,hit[0].i)};
}

// 敬友館の全試合（予選＋決勝T＋団体）
function ourMatches(){
  const list = [];
  for(const cat of CAT_ORDER){
    const c = CATS[cat];
    for(const [L,lg] of Object.entries(c.leagues)){
      for(const [a,b,no] of lg.m){
        for(const [me,op,side] of [[a,b,'a'],[b,a,'b']]){
          if(!isKei(lg.p[me].dojo)) continue;
          list.push({kind:'L', cat, L, no, seq:lg.seq, me:lg.p[me], meId:pid(cat,L,me), op:lg.p[op], side,
            key:`${cat}-${L}-${no}`, title:`${c.name} 予選${L}`});
        }
      }
    }
    for(const t of c.tour){
      const A = resolve(cat,t[1]), B = resolve(cat,t[2]);
      for(const [me,op,side] of [[A,B,'a'],[B,A,'b']]){
        if(me.pending || !isKei(me.dojo)) continue;
        list.push({kind:'T', cat, no:t[0], seq:c.tseq, me, meId:me.id, op, side, key:`${cat}-T-${t[0]}`,
          title:`${c.name} 決勝T${t[3]?'・'+t[3]:''}`});
      }
    }
  }
  const mine = S.meta.team?.mine;
  for(const t of TEAM){
    const A = resolve('team',t[1]), B = resolve('team',t[2]);
    const hasUs = [A,B].findIndex(x=>!x.pending && (x.label===mine || isKei(x.name)));
    if(hasUs < 0) continue;
    const me = hasUs===0?A:B, op = hasUs===0?B:A;
    list.push({kind:'TEAM', cat:'team', no:t[0], seq:'team', court:t[4], me:{name:'敬友館チーム',dojo:DOJO}, meId:'team', op, side:hasUs===0?'a':'b',
      key:`team-T-${t[0]}`, title:`団体戦${t[3]?'・'+t[3]:''}`});
  }
  list.forEach(m=>{
    m.res = S.results[m.key];
    m.court = m.court || SEQS[m.seq].court;
    m.eta = m.kind==='TEAM' ? {min:hm('15:00'), left:null} : eta(m.seq, m.no);
  });
  return list;
}

const TABS = [['next','出番','◎'],['league','予選','表'],['tour','決勝T','T'],['team','団体戦','団'],['prog','進行・履歴','↺']];
function render(){

}
function statusPill(m){
  const r = m.res;
  if(r){ if(r.w==='d') return '<span class="pill p-draw">引分</span>';
    return r.w===m.side ? '<span class="pill p-win">勝ち</span>' : '<span class="pill p-lose">負け</span>'; }
  if(m.eta.live && m.eta.left!=null){
    if(m.eta.left < 0) return '<span class="pill p-wait">結果待ち</span>';
    if(m.eta.left === 0) return '<span class="pill p-soon">試合中</span>';
    return `<span class="pill ${m.eta.left<=3?'p-soon':'p-wait'}">あと${m.eta.left}試合</span>`;
  }
  return '<span class="pill p-wait">予定</span>';
}
function scoreText(r, side){ if(!r || (r.sa==null && r.sb==null)) return ''; const [x,y] = side==='a'?[r.sa,r.sb]:[r.sb,r.sa]; return `${x??'-'}-${y??'-'}`; }
function circ(no, sm){ return `<span class="no${sm?' sm':''}">${no}</span>`; }

function vNext(){

  for(const cat of CAT_ORDER) for(const [L,lg] of Object.entries(CATS[cat].leagues)) lg.p.forEach((p,i)=>{ if(isKei(p.dojo)) players.push({...p, id:pid(cat,L,i), cat, L}); });

    players.map(p=>`<button class="pchip" data-fav="${p.id}" aria-pressed="${favs.has(p.id)}"><span class="star">${favs.has(p.id)?'★':'☆'}</span>${esc(p.name)}<span class="note">${CATS[p.cat].name}${p.L}</span></button>`).join('')+`</div>`;

  return h;
}
function matchCard(m, isNext){
  const opName = m.op.pending ? `${m.op.label}（未確定）` : `${m.op.name}${m.kind==='TEAM'?'':'（'+m.op.dojo+'）'}`;

function tourRows(cat, tour){

    const A = resolve(cat, ra), B = resolve(cat, rb), key = `${cat}-T-${no}`, r = S.results[key];
    const nm = (p, s)=> {
      const cls = !r ? '' : r.w===s ? 'w' : 'l';
      const kei = !p.pending && (isKei(p.dojo) || (cat==='team' && p.label===S.meta.team?.mine));
      return `<span class="${cls} ${kei?'kei':''}">${p.pending ? esc(p.label)+(p.tie?'（同順位）':'') : esc(p.name)+(cat==='team'?'':' <span class="note">'+esc(p.label)+'</span>')}</span>`;
    };
    const ready = !A.pending && !B.pending;

function findMatch(key){
  const [cat, L, noS] = key.split('-'); const no = +noS;
  if(L === 'T'){
    const t = (cat==='team'?TEAM:CATS[cat].tour).find(x=>x[0]===no);
    const A = resolve(cat,t[1]), B = resolve(cat,t[2]);
    return {cat, no, tour:true, A, B, title:`${cat==='team'?'団体戦':CATS[cat].name+' 決勝T'} ${t[3]||''}`};
  }
  const lg = CATS[cat].leagues[L], m = lg.m.find(x=>x[2]===no);
  return {cat, no, tour:false, A:lg.p[m[0]], B:lg.p[m[1]], title:`${CATS[cat].name} 予選${L}`};
}
let draft = null;
// 勝ち負けと点数が食い違うときだけ注意を出す（判定勝ちもあるので保存は止めない）
function scoreWarn(x){
  if(!x.w || x.sa==null || x.sb==null) return '';
  if(x.w==='d' && x.sa!==x.sb) return '引き分けなのに点数が違います。確認してください。';
  if(x.w==='a' && x.sa<x.sb || x.w==='b' && x.sb<x.sa) return '勝った方の点数が少なくなっています。判定勝ちでなければ確認してください。';
  return '';
}
function openSheet(key){
  const m = findMatch(key);
  if(m.A.pending || m.B.pending) return;
  const r = S.results[key];
  if(!canWrite){ ui.tab = m.cat==='team' ? 'team' : m.tour ? 'tour' : 'league'; if(m.cat!=='team'){ if(m.tour) ui.tcat = m.cat; else ui.cat = m.cat; } save('ui',ui); render(); return; }
  draft = {key, w:r?.w||'', sa:r?.sa??null, sb:r?.sb??null, m, fresh:true};
  drawSheet();
}
function drawSheet(){
  const root = document.getElementById('sheetRoot');
  if(!draft){ root.innerHTML = ''; return; }
  const {m} = draft;
  setTimeout(()=>{ if(draft) draft.fresh = false; });
  const nm = (p)=> m.cat==='team' ? esc(p.name) : `${esc(p.name)}<small>${esc(p.dojo)}</small>`;
  root.innerHTML = `<div class="sheet-bg" data-close><div class="sheet${draft.fresh?' anim':''}" role="dialog" aria-modal="true" aria-label="試合結果の入力">
    <div style="display:flex;gap:10px;align-items:center">${circ(m.no)}<div><h3>${esc(m.title)}</h3><div class="note">勝った方を押してください。点数は分かれば入れます（順位の同点判定に使います）</div></div></div>
    <div class="pick">
      <button class="btn" data-w="a" aria-pressed="${draft.w==='a'}"><span class="side">${draft.w==='a'?'勝ち':'　'}</span>${nm(m.A)}</button>
      <button class="btn" data-w="b" aria-pressed="${draft.w==='b'}"><span class="side">${draft.w==='b'?'勝ち':'　'}</span>${nm(m.B)}</button>
    </div>
    ${m.tour?'':`<button class="btn" data-w="d" aria-pressed="${draft.w==='d'}" style="${draft.w==='d'?'background:var(--ai);color:var(--bg)':''}">引き分け</button>`}
    <div class="steps">
      ${['sa','sb'].map((k,i)=>`<div><div class="note">${esc((i?m.B:m.A).name)} の得点</div><div class="step"><button data-sc="${k}" data-d="-1" aria-label="減らす">−</button><output>${draft[k]??'–'}</output><button data-sc="${k}" data-d="1" aria-label="増やす">＋</button></div></div>`).join('')}
    </div>
    ${scoreWarn(draft)?`<div class="note" style="color:var(--aka)">${scoreWarn(draft)}</div>`:''}
    <div class="actions"><button class="btn pri" data-save ${draft.w?'':'disabled'}>保存</button>${S.results[draft.key]?'<button class="btn" data-clear>結果を消す</button>':''}<button class="btn ghost" data-cancel>閉じる</button></div>
  </div></div>`;
}

// 履歴に出す説明文
function resultLabel(key, r){
  const m = findMatch(key), c = '⓪①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳㉑㉒㉓㉔㉕㉖㉗㉘㉙㉚㉛㉜㉝㉞'[m.no] || m.no;
  const head = `${m.title.trim()} ${c} ${m.A.name ?? m.A.label} 対 ${m.B.name ?? m.B.label}`;
  if(!r) return `${head}：結果を消去`;
  // 点数は勝った側を先に書く（「山田の勝ち 2-1」）
  const sc = r.sa!=null && r.sb!=null ? ` ${r.w==='b' ? r.sb+'-'+r.sa : r.sa+'-'+r.sb}` : '';
  return `${head}：${r.w==='d' ? '引き分け' : (r.w==='a' ? m.A.name : m.B.name)+'の勝ち'}${sc}`;
}
document.addEventListener('click', (e)=>{
  const t = e.target.closest('button,[data-close]'); if(!t) return;
  const d = t.dataset;
  if(d.tab){ ui.tab = d.tab; save('ui',ui); render(); scrollTo(0,0); return; }
  if(d.fav){ const s = new Set(ui.fav); s.has(d.fav)?s.delete(d.fav):s.add(d.fav); ui.fav=[...s]; save('ui',ui); render(); return; }
  if(d.only){ ui.onlyFav = d.only==='1'; save('ui',ui); render(); return; }
  if(d.catPick){ ui.cat = d.catPick; save('ui',ui); render(); return; }
  if(d.tcatPick){ ui.tcat = d.tcatPick; save('ui',ui); render(); return; }
  if(d.open){ openSheet(d.open); return; }
  if(d.toastUndo != null){ const ch = toastChange; closeUndoToast(); if(ch) undo(ch.changes, ch.label); return; }
  if(draft){
    if(d.w){ draft.w = d.w; drawSheet(); return; }
    if(d.sc){
      // 片方だけ押したら、もう片方は0点として扱う
      const o = d.sc==='sa' ? 'sb' : 'sa';
      draft[d.sc] = Math.max(0, (draft[d.sc] ?? 0) + (+d.d));
      if(draft[o] == null) draft[o] = 0;
      drawSheet(); return;
    }
    if(d.save!=null && draft.w){ const k = draft.key, body = {w:draft.w, sa:draft.sa, sb:draft.sb, at:Date.now()}; draft=null; drawSheet(); put('results', k, body, resultLabel(k, body)); return; }
    if(d.clear!=null){ const k = draft.key; draft=null; drawSheet(); put('results', k, null, resultLabel(k, null)); return; }
    if(d.cancel!=null || (d.close!=null && e.target===t)){ draft=null; drawSheet(); return; }
  }
  if(d.courtStep){ const n = d.courtStep, c = S.courts['c'+n]; if(!c) return;
    const max = seqCount(c.seq); const no = Math.min(max, Math.max(1, c.no + (+d.d)));
    put('courts','c'+n,{seq:c.seq, no, at:nowMin()}, `${n}コート ${SEQS[c.seq].label} ${no}試合目`, {quiet:true}); return; }
  if(d.noticeSave!=null){ const text = document.getElementById('notice-text').value.trim();
    put('meta','notice', text?{text, when:fmt(nowMin())+' 掲示'}:null, text?`連絡を掲示：${text.slice(0,40)}`:'連絡を消去'); return; }
  if(d.noticeClear!=null){ put('meta','notice',null,'連絡を消去'); return; }
  if(d.teamSave!=null){
    const slots = {}; TEAM_SLOTS.forEach(x=>{ const v = document.getElementById('team-'+x).value.trim(); if(v) slots[x]=v; });
    const mine = document.getElementById('team-mine').value;
    if(mine && !slots[mine]) slots[mine] = DOJO;
    put('meta','team',{slots, mine, members:document.getElementById('team-members').value}, `団体戦の組み合わせを保存${mine?'（敬友館は'+mine+'）':''}`);
    document.querySelectorAll('[data-team-slot],[data-team-members]').forEach(el=>{ el.defaultValue = el.value; });
    return;
  }
  if(d.undo){
    const x = S.log.find(y=>y.lid===d.undo); if(!x) return;
    let ch = []; try{ ch = JSON.parse(x.changes); }catch(err){ return; }
    // 後から別の入力で変わっている所は、2回押しで上書き（confirm() は使えない端末がある）
    if(changedSince(ch) && !armed.has(x.lid)){ armed.add(x.lid); render(); setTimeout(()=>{ armed.delete(x.lid); render(); }, 6000); return; }
    armed.delete(x.lid); undo(ch, x.text); return;
  }
  if(d.clearAll!=null){
    if(!armed.has('ALL')){ armed.add('ALL'); render(); setTimeout(()=>{ armed.delete('ALL'); render(); }, 6000); return; }
    armed.delete('ALL');
    const ch = [];
    for(const kind of Object.keys(COLS)) for(const [id,v] of Object.entries(S[kind])) ch.push({kind, id, before:v, after:null});
    if(!ch.length){ toast('消す入力はありません'); render(); return; }
    ch.forEach(c=>writeDoc(c.kind, c.id, null));
    logChange(ch, `練習の入力を全部消去（${ch.length}件）`);
    render(); undoToast(`練習の入力を全部消去（${ch.length}件）`); return;
  }
});
